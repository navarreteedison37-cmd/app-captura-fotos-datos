name: Generar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Corregir compatibilidad en todas las librerías (classifier)
        run: |
          find mobile-app/node_modules/ -name "build.gradle" -exec sed -i 's/classifier =/archiveClassifier =/g' {} +

      - name: Generar proyecto Android
        run: |
          cd mobile-app
          npx expo prebuild --platform android --no-install

      - name: Configurar SDK en Gradle
        run: |
          echo -e "\next {\n    compileSdkVersion = 33\n    targetSdkVersion = 33\n    minSdkVersion = 21\n    buildToolsVersion = \"33.0.0\"\n}\n" >> mobile-app/android/build.gradle

      - name: Compilar APK con Gradle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: App-APK-Instalador
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
